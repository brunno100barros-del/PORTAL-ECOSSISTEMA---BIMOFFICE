<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BIMOFFICE · Apresentação</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/svg+xml" href="assets/bimoffice-marca.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/styles.css?v=202611171138">
<link rel="stylesheet" href="css/apresentacao.css?v=202611171138">
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem("bimoffice-tema"); } catch (e) {}
  if (t !== "dark" && t !== "light") {
    t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
</head>
<body class="ap">
<div class="fundo" aria-hidden="true"></div>

<header class="apbar" id="apbar">
  <a class="apbar__voltar" href="index.html#informacoes" aria-label="Voltar ao portal BIMOFFICE">
    <img src="assets/bimoffice-marca.svg" width="28" height="28" alt="">
    <span class="apbar__portal">BIMOFFICE</span>
  </a>
  <span class="apbar__nome" id="apbar-nome"></span>
  <div class="apbar__dir">
    <a class="btn btn--prim btn--sm" id="apbar-acessar" href="#" target="_blank" rel="noopener noreferrer">Acessar</a>
    <button class="tema" id="tema-botao" type="button" aria-pressed="false" aria-label="Mudar tema"></button>
  </div>
</header>

<main id="conteudo" class="ap-main"></main>

<footer class="rodape">
  <img src="assets/bimoffice-marca.svg" width="20" height="20" alt="">
  <span><strong>BIMOFFICE</strong> · <span id="rodape-texto"></span></span>
</footer>

<script src="js/config.js?v=202611171138"></script>

</body>
</html>
